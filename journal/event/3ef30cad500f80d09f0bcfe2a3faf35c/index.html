<html lang="zh-CN"><head><script>(() => {
  const url = new URL(location.href);
  const route = url.searchParams.get('__pages_route');
  if (route && (!route.startsWith('/') || route.startsWith('//'))) return;
  const destination = route ? new URL(route, location.origin) : url;
  if (destination.origin !== location.origin) return;
  const pathname = destination.pathname.startsWith('/apps/') ? destination.pathname : destination.pathname.replace(/\/$/, '') || '/';
  history.replaceState(null, '', pathname + destination.search + destination.hash);
})();</script><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="文章、研究与作品的个人空间。记录关于 AI、技术与产品的思考，把想法付诸实践。" /><link rel="stylesheet" href="/site/ui.css" /><title>Xiaowei</title>  <script type="module" crossorigin src="/assets/index-ZcZ6_Gb3.js"></script>
